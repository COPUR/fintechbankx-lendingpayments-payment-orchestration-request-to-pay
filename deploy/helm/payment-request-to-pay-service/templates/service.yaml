apiVersion: v1
kind: Service
metadata:
  name: {{ include "rtp.name" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rtp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rtp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: http-management
      port: 8081
      targetPort: http-management
