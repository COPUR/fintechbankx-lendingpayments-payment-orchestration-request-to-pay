{{- if .Values.networkPolicy.enabled }}
# L3/L4 guard in addition to the mesh's default-deny AuthorizationPolicy
# (the mesh repository owns the ALLOW rules for caller principals).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rtp.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rtp.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range .Values.networkPolicy.apiCallerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8081
          protocol: TCP
    # Kubelet probes are rewritten by Istio to the sidecar's port 15020.
    - ports:
        - port: 15020
          protocol: TCP
{{- end }}
