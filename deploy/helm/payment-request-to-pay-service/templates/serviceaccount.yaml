apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtp.labels" . | nindent 4 }}
  annotations:
    # IRSA role from deploy/terraform output workload_role_arn (MSK topic access).
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required (deploy/terraform output workload_role_arn)" .Values.serviceAccount.roleArn }}
automountServiceAccountToken: true
