# svc-pay-request-to-pay runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: payment-request-to-pay-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_pay_request_to_pay_local}
    username: ${DB_USERNAME:payment_request_to_pay_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_pay_request_to_pay
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_pay_request_to_pay
        jdbc:
          time_zone: UTC
  flyway:
    schemas: sc_pay_request_to_pay
    default-schema: sc_pay_request_to_pay
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    # Runtime-neutral; authentication comes from profile kafka-msk or kafka-strimzi.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    admin:
      # Topics exist only through the platform topic catalog; never create them from here.
      auto-create: false
    producer:
      client-id: svc-pay-request-to-pay
      acks: all
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        linger.ms: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fintechbankx}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fintechbankx/protocol/openid-connect/certs}
          # Access tokens must name this service in aud (Keycloak audience mapper).
          expected-audience: ${OIDC_AUDIENCE:svc-pay-request-to-pay}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-pay-request-to-pay
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-pay-request-to-pay
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability.svc.cluster.local:4318/v1/traces}

openfinance:
  requesttopay:
    cache:
      # Per-replica status cache; other replicas converge within this TTL.
      ttl: ${PAY_REQUEST_CACHE_TTL:PT10S}
    idempotency:
      ttl: PT24H

requesttopay:
  outbox:
    retention: P7D
    relay:
      # Off until the evt.pay.rtp.*.v1 topics exist on the platform cluster (runbook step 1).
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      interval: PT1S
      batch-size: 100
      max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:10}
      send-timeout: PT10S
  housekeeping:
    interval: PT10M

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
