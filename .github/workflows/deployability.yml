name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag payment-request-to-pay-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' payment-request-to-pay-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Vendored platform guard
        run: |
          # Source: COPUR/fintechbankx-platform-delivery-iac-cicd-templates,
          # charts/fintechbankx-service/templates/_helpers.tpl at commit 6b6c317 (header-less copy in
          # templates/_fbx_helpers.tpl); scripts/ci/verify-vendored-guard.sh is the same commit's script.
          scripts/ci/verify-vendored-guard.sh deploy/helm/payment-request-to-pay-service 8ba2e4a11ead019c25bf0a01e4fe4bbabb6fef0e1980e5fa828ccb9f5673f8ba
      - name: Lint and render chart
        shell: bash
        run: |
          set -euo pipefail
          chart=deploy/helm/payment-request-to-pay-service
          sa=payment-request-to-pay-service
          args=(
            --namespace payments
            --set image.repository=ci/payment-request-to-pay-service
            --set image.tag=${{ github.sha }}
            --set serviceAccount.roleArn=arn:aws:iam::111122223333:role/ci-payment-request-to-pay-service-irsa
            --set externalSecret.remoteSecretName=dev/payment-request-to-pay-service/db-app
            --set migration.remoteSecretName=dev/payment-request-to-pay-service/db-migration
            --set-string 'config.DB_URL=jdbc:postgresql://db.ci:5432/db_pay_request_to_pay_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
            --set config.KAFKA_BOOTSTRAP_SERVERS=kafka.ci:9098
            --set config.OIDC_ISSUER_URI=https://identity.ci/realms/fintechbankx
            --set config.OIDC_JWK_SET_URI=https://identity.ci/realms/fintechbankx/protocol/openid-connect/certs
          )
          helm lint "$chart" "${args[@]}"
          rendered="$(helm template ci "$chart" "${args[@]}")"
          helm template ci "$chart" -f "$chart/values-dev.yaml" "${args[@]}" > /dev/null
          # A missing required setting must fail the render.
          for wrong in "--set-string config.DB_URL=" "--set migration.remoteSecretName=" \
                       "--set externalSecret.remoteSecretName=ci/payment-request-to-pay-service/db-app" \
                       "--set externalSecret.remoteSecretName=dev-payment-request-to-pay-service/db-app" \
                       "--set migration.remoteSecretName=dev/other-service/db-migration"; do
            if helm template ci "$chart" "${args[@]}" $wrong > /dev/null 2>&1; then
              echo "chart rendered with $wrong" >&2; exit 1
            fi
          done

          # Guardrail 4a, chart layer. The platform rules are the vendored, unchanged copy in
          # templates/_fbx_helpers.tpl, pinned by sha256 in the "Vendored platform guard" step; this chart's
          # adapter and additions are in templates/_helpers.tpl (rtp.guard).
          # refuse <expected error ERE> <helm args...>: the render must fail for the expected reason, so a
          # probe cannot pass because the render failed for another one.
          refuse() {
            local expect=$1; shift
            local out
            if out="$(helm template ci "$chart" "${args[@]}" "$@" 2>&1)"; then
              echo "chart rendered with: $*" >&2; exit 1
            fi
            if ! grep -Eq "$expect" <<<"$out"; then
              echo "chart refused '$*' for another reason than /$expect/:" >&2; echo "$out" | head -3 >&2; exit 1
            fi
          }
          # accept <helm args...>: a control; the render must succeed, so a rule cannot refuse too much.
          accept() {
            local out
            if ! out="$(helm template ci "$chart" "${args[@]}" "$@" 2>&1)"; then
              echo "chart refused '$*':" >&2; echo "$out" | head -3 >&2; exit 1
            fi
          }

          # Aurora TLS (cicd-templates 4f0f266): bundle mounted at /etc/fintechbankx/rds-ca, exported as
          # DB_SSL_ROOT_CERT in the pods and the migration Job; DB_URL must verify-full against it.
          ca=/etc/fintechbankx/rds-ca/global-bundle.pem
          test "$(grep -c 'name: DB_SSL_ROOT_CERT' <<<"$rendered")" -eq 2
          grep -A1 'name: DB_SSL_ROOT_CERT' <<<"$rendered" | grep -q "value: \"$ca\""
          grep -q 'mountPath: "/etc/fintechbankx/rds-ca"' <<<"$rendered"
          # DB_URL is parsed the way PgJDBC reads it (fbx.validateJdbcUrl), not searched for a substring:
          # exactly one lower-case sslmode=verify-full, exactly one sslrootcert equal to the mounted bundle,
          # no verification-bypass parameter, no percent-encoded '=' or '&', no TLS key before the '?',
          # no ${...} placeholder or $(VAR) reference.
          refuse 'config.DB_URL must not contain' --set-string "config.DB_URL=jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=\${CA}"
          refuse 'config.DB_URL must not contain' --set-string 'config.DB_URL=jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$(CA)'
          refuse 'config.DB_URL must be a jdbc:' --set-string 'config.DB_URL=postgresql://db.ci:5432/db'
          refuse 'is DB_URL in another spelling' --set-string 'config.db\.url=x'
          for url in 'jdbc:postgresql://db.ci:5432/db?sslmode=require' \
                     'jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=/etc/ssl/rds/global-bundle.pem' \
                     'jdbc:postgresql://db.ci:5432/db?sslmode=verify-full' \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&sslmode=disable" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=/tmp/decoy.pem&sslrootcert=$ca" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&sslfactory=org.postgresql.ssl.NonValidatingFactory" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&sslfactoryarg=x" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&sslhostnameverifier=x.Y" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&sslpasswordcallback=x.Y" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&service=rtp" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode=require&applicationName=sslmode=verify-full&sslrootcert=$ca" \
                     "jdbc:postgresql://db.ci:5432/db?SSLMODE=verify-full&sslrootcert=$ca" \
                     "jdbc:postgresql://db.ci:5432/db?sslmode%3Dverify-full&sslrootcert=$ca" \
                     "jdbc:postgresql://sslmode=disable@db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca"; do
            refuse 'config.DB_URL must' --set-string "config.DB_URL=$url"
          done
          # Governance round 3 (2b), rounds 5 and 6: no config key may redirect Spring's configuration,
          # activate a profile in the image (application-local.yml switches the TLS assertion off), replace
          # the database URL behind the verify-full check, replace a trust anchor (spring.ssl.*, *ssl.bundle*,
          # DB_SSL_ROOT_CERT, PGSSLROOTCERT), set Kafka client properties or switch the assertion off, in any
          # spelling Spring's relaxed binding reads, indexed and canonical forms included
          # (fbx.datasourceOverrideName + rtp.guardConfigName).
          for key in SPRING_CONFIG_IMPORT spring_config_import Spring_Config_Location SPRING_CONFIG_ADDITIONAL_LOCATION \
                     SPRING_CONFIG_IMPORT_0 SPRING_CONFIG_IMPORT_0_ SPRING_CONFIG_LOCATION_0 SPRING_CONFIG_ADDITIONAL_LOCATION_0 \
                     SPRING_CONFIG_NAME spring.config.import spring-config-import spring.config.activate.on-profile \
                     SPRING_PROFILES_ACTIVE SPRING_PROFILES_ACTIVE_0 SPRING_PROFILES_INCLUDE SPRING_PROFILES_INCLUDE_0 \
                     SPRING_PROFILES_DEFAULT SPRING_PROFILES_GROUP_KAFKA_MSK SPRING_PROFILES_GROUP_KAFKA_MSK_0 spring.profiles.group.kafka-msk \
                     spring.pro-files.active \
                     SPRING_APPLICATION_JSON spring.application.json \
                     SPRING_DATASOURCE_URL SPRING_DATASOURCE_HIKARI_JDBC_URL SPRING_DATASOURCE_HIKARI_JDBCURL spring.datasource.hikari.jdbc-url \
                     SPRING_FLYWAY_URL SPRING_FLYWAY_LOCATIONS SPRING_LIQUIBASE_URL SPRING_R2DBC_URL MY_JDBC_URL X_SSLFACTORY PGJDBC_SSL_FACTORY \
                     SPRING_SSL_BUNDLE_PEM_DB_TRUSTSTORE_CERTIFICATE spring.ssl.bundle.jks.kafka.truststore.location SPRING_KAFKA_SSL_BUNDLE \
                     DB_SSL_ROOT_CERT PGSSLROOTCERT OPF_DB_SSL_MODE \
                     FINTECHBANKX_TLS_ENFORCE FINTECHBANKX_TLS_ENFORCE_0 fintechbankx.tls.enforce fintechbankx-tls-enforce FINTECHBANKXTLS_ENFORCE \
                     SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION spring.kafka.properties.sasl.jaas.config; do
            refuse "config\.${key//./\\.} is not allowed|config\.${key//./\\.} must" --set-string "config.${key//./\\.}=x"
          done
          # Kafka protocol names are checked by value (fbx.validateKafkaTls): SASL_SSL with kafka-msk, SSL with
          # kafka-strimzi, never PLAINTEXT; endpoint identification must stay https.
          for key in KAFKA_SECURITY_PROTOCOL SPRING_KAFKA_SECURITY_PROTOCOL SPRING_KAFKA_PRODUCER_SECURITY_PROTOCOL; do
            refuse "config\.$key must be SASL_SSL or SSL" --set-string "config.$key=PLAINTEXT"
            refuse "config\.$key must be SASL_SSL with kafka.runtime msk" --set-string "config.$key=SSL"
            refuse "config\.$key must be SSL with kafka.runtime strimzi" --set kafka.profile=kafka-strimzi --set-string "config.$key=SASL_SSL"
          done
          refuse 'must be https' --set-string 'config.SPRING_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM='
          # JVM options need a literal value that names none of the routes above (fbx.validateJvmOptions,
          # plus rtp.guardConfigName's fintechbankx and kafka words); the entrypoint reads no JAVA_OPTS.
          for name in JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS; do
            for opt in '-Dfintechbankx.tls.enforce=false' '-Dspring.datasource.url=jdbc:postgresql://db.ci:5432/db' \
                       '-Dspring.profiles.default=local' '-Dspring.config.import[0]=file:/tmp/x.yml' \
                       '-Dspring.kafka.security.protocol=PLAINTEXT' '-Djavax.net.ssl.trustStore=/tmp/x' \
                       '@/tmp/opts' '-XX:VMOptionsFile=/tmp/opts' '-XX:+UseG1GC -Dspring.application.json=x' \
                       '-Djdk.tls.client.protocols=TLSv1' '-Djava.security.properties=/tmp/java.security' \
                       '-Dspring..config.import=file:/tmp/x.yml' '-Dspring.kafka.properties.sasl.jaas.config=x' \
                       '-XX:MaxRAMPercentage=75 $(FBX_X)' '-Dfintechbankx.x=${FBX_X}'; do
              refuse "config\.$name must not" --set-string "config.$name=$opt"
            done
          done
          # The profile the chart activates is exactly kafka-msk or kafka-strimzi (rtp.kafkaRuntime -> fbx.kafkaProfile):
          # no local, no list, no empty value.
          refuse 'kafka.profile must be exactly kafka-msk or kafka-strimzi' --set kafka.profile=local
          refuse 'kafka.profile must be exactly kafka-msk or kafka-strimzi' --set-string 'kafka.profile=kafka-msk\,local'
          refuse 'kafka.profile must be exactly kafka-msk or kafka-strimzi' --set kafka.profile=
          # Env sources the guard never sees do not exist in this chart: extraEnv (even with a $(VAR) value or
          # valueFrom), envFrom, extraEnvFrom and externalSecret.dataFrom all fail the render.
          refuse 'extraEnv' --set extraEnv[0].name=DB_URL --set extraEnv[0].value=x
          refuse 'extraEnv' --set extraEnv[0].name=FOO --set-string 'extraEnv[0].value=$(DB_URL)'
          refuse 'extraEnv' --set extraEnv[0].name=JAVA_TOOL_OPTIONS --set extraEnv[0].valueFrom.secretKeyRef.name=x --set extraEnv[0].valueFrom.secretKeyRef.key=y
          refuse 'envFrom is not supported' --set envFrom[0].configMapRef.name=other
          refuse 'extraEnvFrom is not supported' --set extraEnvFrom[0].secretRef.name=other
          refuse 'externalSecret.dataFrom is not supported' --set externalSecret.dataFrom[0].extract.key=dev/payment-request-to-pay-service/db-app
          # Template interpolation: a config key with a newline must not inject a second key; a value with a
          # newline is rendered quoted, so the ConfigMap keeps exactly the keys the guard saw.
          printf 'config:\n  "X\\nSPRING_CONFIG_IMPORT": "optional:file:/tmp/x.yml"\n' > /tmp/rtp-key-newline.yaml
          refuse 'is not a ConfigMap key' -f /tmp/rtp-key-newline.yaml
          printf 'config:\n  X: "a\\nSPRING_CONFIG_IMPORT: optional:file:/tmp/x.yml"\n' > /tmp/rtp-value-newline.yaml
          helm template ci "$chart" "${args[@]}" -f /tmp/rtp-value-newline.yaml --show-only templates/configmap.yaml \
            | python3 -c 'import sys,yaml; d=yaml.safe_load(sys.stdin)["data"]; assert "SPRING_CONFIG_IMPORT" not in d and "\n" in d["X"], d'
          if ! helm template ci "$chart" "${args[@]}" --set-string config.DB_POOL_MIN_IDLE=2 \
                 --set-string 'config.JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50' \
                 --set-string config.KAFKA_SECURITY_PROTOCOL=SASL_SSL > /dev/null; then
            echo "the config guard rejected an ordinary config key, a plain JVM option or the MSK protocol" >&2; exit 1
          fi

          # Platform guard tests of cicd-templates 6b6c317 (database CA, Kafka client TLS, DocumentDB, property
          # reading and relaxed binding names), as render probes: this chart has no helm-unittest. Each probe
          # states the guard's real message, so it cannot pass because the render failed for another reason.
          # Cases that need a value this chart does not have are not copied: javaToolOptions (none), the
          # ExternalSecret data/extraData (fixed by the adapter), databaseCa.enabled (always true), extraEnv
          # controls (extraEnv is refused whole), and kafka.runtime empty (kafka.profile is exactly msk or strimzi).
          # database CA mount (databaseCa.*) (cicd-templates 6b6c317 tests/database_ca_test.yaml)
          refuse 'databaseCa.mountPath must be /etc/fintechbankx/rds-ca \(got "/app/config"\)' --set-string databaseCa.mountPath=/app/config --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/app/config/global-bundle.pem'
          refuse 'databaseCa.mountPath must be /etc/fintechbankx/rds-ca' --set-string databaseCa.mountPath=/etc/fintechbankx/rds-ca/
          refuse 'databaseCa.key must be global-bundle.pem \(got "other-bundle.pem"\)' --set-string databaseCa.key=other-bundle.pem --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/other-bundle.pem'
          refuse 'databaseCa.configMapName must be rds-ca-bundle \(got "any-config"\)' --set-string databaseCa.configMapName=any-config
          refuse 'databaseCa.configMapName is required while databaseCa.enabled' --set databaseCa.configMapName=null
          refuse 'config.DB_URL must use sslmode=verify-full' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=require'
          refuse 'config.DB_URL must set sslmode exactly once' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&sslmode=require'
          refuse 'config.DB_URL must use sslmode=verify-full' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?xsslmode=verify-full&sslmode=disable&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          refuse 'config.DB_URL must set sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem exactly once' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/tmp/attacker.pem'
          refuse 'config.DB_URL must set sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem exactly once' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full'
          refuse 'config.DB_URL must not set sslfactory' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&sslfactory=org.postgresql.ssl.NonValidatingFactory'
          refuse 'config.DB_URL must not set sslhostnameverifier' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&sslhostnameverifier=com.example.AllowAll'
          refuse 'config.DB_URL must not set service' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&service=loan'
          refuse 'config.DB_URL must not percent-encode' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&sslmode%3Ddisable'
          refuse 'config.DB_URL has a query parameter name that is not plain' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&ssl%6Dode=disable'
          refuse 'config.DB_URL must spell SSLMODE in lower case' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?SSLMODE=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          refuse 'config.DB_URL must carry TLS parameters only in the query string' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db;sslmode=disable?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          refuse 'config.SPRING_DATASOURCE_URL is not allowed' --set-json 'config={"SPRING_DATASOURCE_URL":"jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=require"}'
          refuse 'extraEnv must not set DB_URL' --set-json 'extraEnv=[{"name":"DB_URL","value":"jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=require"}]'
          refuse 'extraEnv must not set SPRING_DATASOURCE_URL' --set-json 'extraEnv=[{"name":"SPRING_DATASOURCE_URL","value":"jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=require"}]'
          refuse 'extraEnv.REPORTING_DB_JDBC must use sslmode=verify-full' --set-json 'extraEnv=[{"name":"REPORTING_DB_JDBC","value":"jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=require"}]'
          refuse 'config.DB_URL must use sslmode=verify-full' --set-string 'config.DB_URL=jdbc:aws-wrapper:postgresql://db.example.internal:5432/db?sslmode=require'
          refuse 'config.DB_URL must not set sslpasswordcallback' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&sslpasswordcallback=com.example.Callback'
          refuse 'extraEnv must not set Spring_Datasource_Hikari_Jdbc_Url' --set-json 'extraEnv=[{"name":"Spring_Datasource_Hikari_Jdbc_Url","value":"jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"}]'
          refuse 'extraEnv must not set SPRING_FLYWAY_URL' --set-json 'extraEnv=[{"name":"SPRING_FLYWAY_URL","value":"jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"}]'
          refuse 'extraEnv must not set spring_application_json' --set-json 'extraEnv=[{"name":"spring_application_json","value":"{\"spring.datasource.url\":\"x\"}"}]'
          refuse 'config.SPRING_FLYWAY_URL is not allowed' --set-json 'config={"SPRING_FLYWAY_URL":"jdbc:postgresql://db.example.internal:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"}'
          refuse 'config.SPRING_APPLICATION_JSON is not allowed' --set-json 'config={"SPRING_APPLICATION_JSON":"{\"spring.datasource.url\":\"x\"}"}'
          refuse 'config.SPRING_DATASOURCE_HIKARI_JDBC_URL is not allowed' --set-json 'config={"SPRING_DATASOURCE_HIKARI_JDBC_URL":"x"}'
          # Kafka client TLS names (cicd-templates 6b6c317 tests/kafka_client_tls_names_test.yaml)
          refuse 'config.SPRING_KAFKA_SSL_TRUSTSTORE_LOCATION is not allowed: a Kafka client TLS setting' --set-json 'config={"SPRING_KAFKA_SSL_TRUSTSTORE_LOCATION":"file:/etc/other/any.jks"}'
          refuse 'config.SPRING_KAFKA_SSL_TRUST_STORE_LOCATION is not allowed: a Kafka client TLS setting' --set-json 'config={"SPRING_KAFKA_SSL_TRUST_STORE_LOCATION":"file:/etc/other/any.jks"}'
          refuse 'config.spring.kafka.ssl.trust-store-certificates is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.ssl.trust-store-certificates":"-----BEGIN CERTIFICATE-----"}'
          refuse 'config.spring.kafka.s-sl.trust-store-location is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.s-sl.trust-store-location":"file:/etc/other/any.jks"}'
          refuse 'config.SPRING_KAFKA_SSL_PROTOCOL is not allowed: a Kafka client TLS setting' --set-json 'config={"SPRING_KAFKA_SSL_PROTOCOL":"TLSv1"}'
          refuse 'extraEnv must not set SPRING_KAFKA_PRODUCER_SSL_KEY_STORE_LOCATION \(value or valueFrom\): a Kafka client TLS setting' --set-json 'extraEnv=[{"name":"SPRING_KAFKA_PRODUCER_SSL_KEY_STORE_LOCATION","value":"file:/etc/other/any.p12"}]'
          refuse 'extraEnv must not set spring.kafka.consumer.ssl.trust-store-type \(value or valueFrom\): a Kafka client TLS setting' --set-json 'extraEnv=[{"name":"spring.kafka.consumer.ssl.trust-store-type","valueFrom":{"configMapKeyRef":{"name":"other","key":"type"}}}]'
          refuse 'config.SPRING_KAFKA_ADMIN_SSL_TRUST_STORE_CERTIFICATES is not allowed: a Kafka client TLS setting' --set-json 'config={"SPRING_KAFKA_ADMIN_SSL_TRUST_STORE_CERTIFICATES":"-----BEGIN CERTIFICATE-----"}'
          refuse 'config.spring.kafka.streams.ssl.key-password is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.streams.ssl.key-password":"x"}'
          refuse 'config.spring.kafka.properties.ssl.truststore.location is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.properties.ssl.truststore.location":"/etc/other/any.jks"}'
          refuse 'config.SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION is not allowed: a Kafka client TLS setting' --set-json 'config={"SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION":"/etc/other/any.jks"}'
          refuse 'config.spring.kafka.properties\[ssl.truststore.type\] is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.properties[ssl.truststore.type]":"PEM"}'
