{{- /* Guardrail 4a: the vendored platform guard runs once here, on every route this chart renders (rtp.guard, _helpers.tpl). */ -}}
{{- include "rtp.guard" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rtp.name" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rtp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "rtp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rtp.selectorLabels" . | nindent 8 }}
        app: {{ .Values.serviceAccount.name | quote }}
        version: {{ .Values.image.tag | quote }}
        app.kubernetes.io/part-of: fintechbankx-payments
        # Observability's PodMonitor fintechbankx-services selects this label.
        fintechbankx.io/service-id: svc-pay-request-to-pay
        fintechbankx.io/app: app-pay-request-to-pay
        fintechbankx.io/squad: {{ .Values.squad | quote }}
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/inject: "true"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- if eq (include "rtp.kafkaRuntime" .) "strimzi" }}
        # Strimzi does its own mutual TLS on 9093; the sidecar must not wrap it.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9093"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      # Native sidecars are mesh-wide (mesh 4bf3906, istiod ENABLE_NATIVE_SIDECARS):
      # the proxy stops after the application container, so no drain annotation
      # is needed. The grace period bounds preStop 10 s +
      # spring.lifecycle.timeout-per-shutdown-phase 40 s with headroom.
      terminationGracePeriodSeconds: 65
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "rtp.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "rtp.selectorLabels" . | nindent 14 }}
      containers:
        - name: payment-request-to-pay-service
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: http-management
              containerPort: 8081
          # The only env the chart renders: its own entries (none from values other than the
          # guarded kafka.profile and databaseCa), then envFrom of its own ConfigMap and Secret.
          env:
            # Exactly kafka-msk or kafka-strimzi (rtp.kafkaProfile, fbx.kafkaProfile); the local profile is never deployed.
            - name: SPRING_PROFILES_ACTIVE
              value: {{ include "rtp.kafkaProfile" . | quote }}
            # Migrations run only in the pre-install/pre-upgrade Job as the
            # schema owner; the pods hold the runtime role and never migrate.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            # Path of the mounted RDS CA bundle (cicd-templates 4f0f266).
            - name: DB_SSL_ROOT_CERT
              value: {{ include "rtp.databaseCaPath" . | quote }}
            {{- if eq (include "rtp.kafkaRuntime" .) "strimzi" }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimziTlsSecret | quote }}
                  key: user.crt
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimziTlsSecret | quote }}
                  key: user.key
            # The broker is trusted through the Strimzi cluster CA (event-streaming
            # 5f7d546), not the client CA in the KafkaUser secret.
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafka.strimziClusterCaSecret is required" .Values.kafka.strimziClusterCaSecret | quote }}
                  key: ca.crt
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "rtp.name" . | quote }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "rtp.dbSecretName" . | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: {{ .Values.databaseCa.mountPath | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Platform ConfigMap (trust-manager); not optional, so a missing bundle
        # stops the pod instead of letting it connect unverified.
        - name: database-ca
          configMap:
            name: {{ .Values.databaseCa.configMapName | quote }}
            items:
              - key: {{ .Values.databaseCa.key | quote }}
                path: {{ .Values.databaseCa.key | quote }}
