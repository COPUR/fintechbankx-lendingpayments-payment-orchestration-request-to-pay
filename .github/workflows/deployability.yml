          refuse 'config.SPRING_DATA_MONGODB_SSL_ENABLED is not allowed: a spring.data.mongodb.\* property' --set-json 'config={"SPRING_DATA_MONGODB_SSL_ENABLED":"false"}'
          refuse 'extraEnv must not set spring.data.mongodb.host \(value or valueFrom\): a spring.data.mongodb.\* property' --set-json 'extraEnv=[{"name":"spring.data.mongodb.host","value":"other.example.internal"}]'
          refuse 'extraEnv must not set SPRING_DATA_MONGODB_REPLICA_SET_NAME \(value or valueFrom\): a spring.data.mongodb.\* property' --set-json 'extraEnv=[{"name":"SPRING_DATA_MONGODB_REPLICA_SET_NAME","valueFrom":{"configMapKeyRef":{"name":"other","key":"rs"}}}]'
          refuse 'config.spring.data.mongodb.password is not allowed: a spring.data.mongodb.\* property' --set-json 'config={"spring.data.mongodb.password":"x"}'
          refuse 'config.MONGODB_URI is not allowed: MONGODB_URI is the DocumentDB connection string' --set-json 'config={"MONGODB_URI":"mongodb://docdb.example.internal:27017/db?tls=false"}'
          refuse 'extraEnv MONGODB_URI must come from valueFrom.secretKeyRef' --set-json 'extraEnv=[{"name":"MONGODB_URI","value":"mongodb://docdb.example.internal:27017/db?tlsAllowInvalidCertificates=true"}]'
          refuse 'extraEnv MONGODB_URI must come from valueFrom.secretKeyRef' --set-json 'extraEnv=[{"name":"MONGODB_URI","valueFrom":{"configMapKeyRef":{"name":"other","key":"uri"}}}]'
          refuse 'extraEnv mongodb.uri is not allowed: MONGODB_URI is the DocumentDB connection string' --set-json 'extraEnv=[{"name":"mongodb.uri","valueFrom":{"secretKeyRef":{"name":"docdb-app","key":"uri"}}}]'
          refuse 'config.JDK_JAVA_OPTIONS must not mention .*kafka' --set-json 'config={"JDK_JAVA_OPTIONS":"-Dspring.Kaf_ka.producer.acks=0"}'
          refuse 'extraEnv._JAVA_OPTIONS must not mention .*kafka' --set-json 'extraEnv=[{"name":"_JAVA_OPTIONS","value":"-Dlogging.level.org.apache.kafka=DEBUG"}]'
          # property-reading names (cicd-templates 6b6c317 tests/property_reading_names_test.yaml)
          refuse 'config.spring.kafka.s_sl.trust-store-type is not allowed: a Kafka client TLS setting' --set kafka.profile=kafka-strimzi --set-json 'config={"KAFKA_SECURITY_PROTOCOL":"SSL","spring.kafka.s_sl.trust-store-type":"PKCS12"}'
          refuse 'extraEnv must not set spring.kafka.consumer.s_sl.trust-store-type \(value or valueFrom\): a Kafka client TLS setting' --set-json 'extraEnv=[{"name":"spring.kafka.consumer.s_sl.trust-store-type","valueFrom":{"secretKeyRef":{"name":"other","key":"type"}}}]'
          refuse 'config.spring.kafka.con_sumer.ssl.trust-store-type is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.con_sumer.ssl.trust-store-type":"PKCS12"}'
          refuse 'config.spring.kafka.streams.pro_perties.ssl.truststore.location is not allowed: a Kafka client TLS setting' --set-json 'config={"spring.kafka.streams.pro_perties.ssl.truststore.location":"/etc/other/any.jks"}'
          refuse 'config.spring.kafka.security.pro_tocol must be SASL_SSL or SSL' --set-json 'config={"spring.kafka.security.pro_tocol":"PLAINTEXT"}'
          refuse 'extraEnv spring.kafka.secu_rity.protocol must set a literal value' --set-json 'extraEnv=[{"name":"spring.kafka.secu_rity.protocol","valueFrom":{"configMapKeyRef":{"name":"other","key":"protocol"}}}]'
          refuse 'config.spring.data.mongo_db.host is not allowed: a spring.data.mongodb.\* property' --set-json 'config={"spring.data.mongo_db.host":"placeholder-host"}'
          refuse 'extraEnv must not set spring.data.mongo_db.uri \(value or valueFrom\): a spring.data.mongodb.\* property' --set-json 'extraEnv=[{"name":"spring.data.mongo_db.uri","valueFrom":{"secretKeyRef":{"name":"other","key":"uri"}}}]'
          refuse 'config.spring.da_ta.mongodb.port is not allowed: a spring.data.mongodb.\* property' --set-json 'config={"spring.da_ta.mongodb.port":"27018"}'
          refuse 'config.spring.pro_files.active is not allowed: a profile can activate' --set-json 'config={"spring.pro_files.active":"local"}'
          refuse 'extraEnv must not set spring.pro_files.default \(value or valueFrom\): a profile can activate' --set-json 'extraEnv=[{"name":"spring.pro_files.default","value":"local"}]'
          refuse 'extraEnv must not set s_pring.profiles.active \(value or valueFrom\): a profile can activate' --set-json 'extraEnv=[{"name":"s_pring.profiles.active","value":"local"}]'
          refuse 'config.spring.con_fig.import is not allowed: a spring.config.\* property' --set-json 'config={"spring.con_fig.import":"optional:file:/etc/other/override.yml"}'
          refuse 'extraEnv must not set spring.applica_tion.json \(value or valueFrom\): it can redirect or override the datasource' --set-json 'extraEnv=[{"name":"spring.applica_tion.json","value":"{\"spring\":{\"datasource\":{\"url\":\"jdbc:h2:mem:x\"}}}"}]'
          refuse 'config.spring.s_sl.bundle.pem.documentdb.truststore.certificate is not allowed: an SSL bundle property' --set-json 'config={"spring.s_sl.bundle.pem.documentdb.truststore.certificate":"file:/etc/other/any-ca.pem"}'
          refuse 'config.fintech_bankx.tls.enforce is not allowed: it can switch off the service'"'"'s startup TLS assertion' --set-json 'config={"fintech_bankx.tls.enforce":"false"}'
          refuse 'extraEnv must not set fintechbankx.t_ls.enforce \(value or valueFrom\): it can switch off' --set-json 'extraEnv=[{"name":"fintechbankx.t_ls.enforce","valueFrom":{"configMapKeyRef":{"name":"other","key":"enforce"}}}]'
          refuse 'config.spring.data_source.url is not allowed: it can redirect or override the datasource' --set-json 'config={"spring.data_source.url":"jdbc:h2:mem:x"}'
          refuse 'config.spring.data_source.driver-class-name is not allowed: it can redirect or override the datasource' --set-json 'config={"spring.data_source.driver-class-name":"org.h2.Driver"}'
          refuse 'config.spring.fly_way.url is not allowed: it can redirect or override the datasource' --set-json 'config={"spring.fly_way.url":"jdbc:h2:mem:x"}'
          # relaxed binding names (cicd-templates 6b6c317 tests/relaxed_binding_names_test.yaml)
          refuse 'config.spring.pro-files.active is not allowed' --set-json 'config={"spring.pro-files.active":"local"}'
          refuse 'extraEnv must not set spring.profiles\[active\]' --set-json 'extraEnv=[{"name":"spring.profiles[active]","value":"local"}]'
          refuse 'extraEnv must not set spring\[profiles\].default' --set-json 'extraEnv=[{"name":"spring[profiles].default","valueFrom":{"configMapKeyRef":{"name":"other","key":"profile"}}}]'
          refuse 'config.fintech-bankx.tls.enforce is not allowed' --set-json 'config={"fintech-bankx.tls.enforce":"false"}'
          refuse 'extraEnv must not set fintechbankx.tls\[enforce\]' --set-json 'extraEnv=[{"name":"fintechbankx.tls[enforce]","value":"false"}]'
          refuse 'config.spring.data-source.url is not allowed' --set-json 'config={"spring.data-source.url":"jdbc:h2:mem:x"}'
          refuse 'extraEnv must not set spring.datasource\[url\]' --set-json 'extraEnv=[{"name":"spring.datasource[url]","value":"jdbc:h2:mem:x"}]'
          refuse 'extraEnv must not set SPRING_CONFIG_IMPORT' --set-json 'extraEnv=[{"name":"SPRING_CONFIG_IMPORT ","value":"optional:file:/tmp/x.yml"}]'
          refuse 'extraEnv.spring.kafka.properties\[security.protocol\] must be SASL_SSL or SSL' --set-json 'extraEnv=[{"name":"spring.kafka.properties[security.protocol]","value":"PLAINTEXT"}]'
          refuse 'config.spring.kafka.secu-rity.protocol must be SASL_SSL or SSL' --set-json 'config={"spring.kafka.secu-rity.protocol":"PLAINTEXT"}'
          refuse 'config.ssl.endpoint.identi-fication.algorithm must be https' --set-json 'config={"ssl.endpoint.identi-fication.algorithm":""}'
          refuse 'config.JDK_JAVA_OPTIONS must not mention' --set-json 'config={"JDK_JAVA_OPTIONS":"-Dfintech-bankx.tls.enforce=false"}'
          refuse 'extraEnv._JAVA_OPTIONS must not mention' --set-json 'extraEnv=[{"name":"_JAVA_OPTIONS","value":"-Dspring.kafka.secu-rity.protocol=PLAINTEXT"}]'
          refuse 'extraEnv JAVA_TOOL_OPTIONS must set a literal value' --set-json 'extraEnv=[{"name":"JAVA_TOOL_OPTIONS","value":"","valueFrom":{"configMapKeyRef":{"name":"other","key":"opts"}}}]'
          refuse 'extraEnv must not set spring.pro:files.active' --set-json 'extraEnv=[{"name":"spring.pro:files.active","value":"local"}]'
          refuse 'extraEnv must not set SPRING_CON\$FIG_IMPORT' --set-json 'extraEnv=[{"name":"SPRING_CON$FIG_IMPORT","valueFrom":{"configMapKeyRef":{"name":"other","key":"import"}}}]'
          refuse 'extraEnv must not set fintechbankx.t'"'"'ls.enforce' --set-json 'extraEnv=[{"name":"fintechbankx.t'"'"'ls.enforce","value":"false"}]'
          # From scripts/ci/validate-chart.sh must_fail (6b6c317), in this chart's value names.
          refuse 'extraEnv must not set SPRING_KAFKA_PRODUCER_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES' --set 'extraEnv[0].name=SPRING_KAFKA_PRODUCER_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.key=ca'
          refuse 'config.KAFKA_TLS_CERT is not allowed' --set kafka.profile=kafka-strimzi --set-string 'config.KAFKA_TLS_CERT=-----BEGIN CERTIFICATE-----'
          # Control: plain database URL options stay accepted. (The platform controls that accept
          # spring.kafka.properties.* names such as sasl.*, which rtp.guardConfigName refuses in this chart.)
          accept --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db_ln_loan_lifecycle_dev?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&ApplicationName=loan&connectTimeout=10'

          # Flyway runs only in the hook Job, as the schema owner; the pods never get that secret.
          job="$(helm template ci "$chart" "${args[@]}" --show-only templates/migration-job.yaml)"
          grep -q 'helm.sh/hook: pre-install,pre-upgrade' <<<"$job"
          grep -q 'args: \["migrate"\]' <<<"$job"
          grep -q 'key: "dev/payment-request-to-pay-service/db-migration"' <<<"$job"
          deployment="$(helm template ci "$chart" "${args[@]}" --show-only templates/deployment.yaml)"
          grep -A1 'name: SPRING_FLYWAY_ENABLED' <<<"$deployment" | grep -q 'value: "false"'
          if grep -q 'db-migration' <<<"$deployment"; then echo "the service pods reference the migration secret" >&2; exit 1; fi

          # Job convention (cicd-templates 335a345): the Job pod carries name=<SA> and component
          # db-migration, API pods component service; no Service, PDB, Deployment, topology spread or
          # NetworkPolicy selector may select the Job pod, and only API pods carry the service-id label.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          helm template ci "$chart" "${args[@]}" --set networkPolicy.enabled=true | python3 scripts/ci/helm-selector-check.py "$sa" svc-pay-request-to-pay
          if helm template ci "$chart" "${args[@]}" --set networkPolicy.enabled=true \
               | sed 's/app.kubernetes.io\/component: db-migration/app.kubernetes.io\/component: service/' \
               | python3 scripts/ci/helm-selector-check.py "$sa" svc-pay-request-to-pay 2>/dev/null; then
            echo "helm-selector-check accepted a Job pod the Service would select" >&2; exit 1
          fi

          # ExternalSecret scope (admission policy fintechbankx-externalsecret-scope) and the naming
          # contract (check copied from customer-profile-kyc-core 58f7369), hook resources included.
          python3 scripts/ci/externalsecret-scope.py "$sa" dev <<<"$rendered"
          python3 scripts/ci/externalsecret-naming.py --env dev <<<"$rendered"
          helm template ci "$chart" -f "$chart/values-dev.yaml" "${args[@]}" | python3 scripts/ci/externalsecret-naming.py --env dev
          if helm template ci "$chart" "${args[@]}" --set serviceAccount.name=some-other-service 2>/dev/null \
               | python3 scripts/ci/externalsecret-naming.py --env dev 2>/dev/null; then
            echo "externalsecret-naming accepted a wrong render" >&2; exit 1
          fi

          # Platform review round 2: NetworkPolicy is the mesh repo's (off by default, never a CIDR,
          # no open probe port), the observability PodMonitor is the single scrape path (no
          # ServiceMonitor), squad label, 65 s grace period with no sidecar drain annotation (native
          # sidecars are mesh-wide, mesh 4bf3906), the migration Job sidecar-less with its own component
          # (mesh d2ccacc: a sidecar-less Job may not share its component with a meshed workload), and
          # Strimzi trusts the cluster CA.
          if grep -qE '^kind: (NetworkPolicy|ServiceMonitor)$' <<<"$rendered"; then
            echo "chart renders a NetworkPolicy or ServiceMonitor by default" >&2; exit 1
          fi
          policy="$(helm template ci "$chart" "${args[@]}" --set networkPolicy.enabled=true --show-only templates/networkpolicy.yaml)"
          if grep -qE 'ipBlock|cidr' <<<"$policy"; then echo "the opt-in NetworkPolicy admits a CIDR" >&2; exit 1; fi
          # A rule without a source would open its ports to every pod (the old any-source 15020 rule).
          if python3 -c 'import sys,yaml; d=yaml.safe_load(sys.stdin); sys.exit(0 if any("from" not in r for r in d["spec"]["ingress"]) else 1)' <<<"$policy"; then
            echo "the opt-in NetworkPolicy has a rule without a source" >&2; exit 1
          fi
          grep -q 'fintechbankx.io/service-id: svc-pay-request-to-pay' <<<"$deployment"
          grep -q 'prometheus.io/port: "8081"' <<<"$deployment"
          if grep -q 'terminationDrainDuration' <<<"$deployment"; then echo "drain annotation is redundant with native sidecars" >&2; exit 1; fi
          job="$(helm template ci "$chart" "${args[@]}" --show-only templates/migration-job.yaml)"
          python3 - "$job" "$deployment" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.argv[1]) if d]
          job = [d for d in docs if d["kind"] == "Job"][0]["spec"]["template"]["metadata"]
          dep = yaml.safe_load(sys.argv[2])["spec"]["template"]["metadata"]
          assert job["labels"]["sidecar.istio.io/inject"] == "false", job["labels"]
          assert job["annotations"]["sidecar.istio.io/inject"] == "false", job["annotations"]
          assert dep["labels"]["sidecar.istio.io/inject"] == "true", dep["labels"]
          # A sidecar-less Job may not share app.kubernetes.io/component with a meshed workload (mesh d2ccacc).
          assert job["labels"]["app.kubernetes.io/component"] == "db-migration" != dep["labels"]["app.kubernetes.io/component"], (job["labels"], dep["labels"])
          PY
          grep -q 'terminationGracePeriodSeconds: 65' <<<"$deployment"
          test "$(grep -c 'fintechbankx.io/squad: "payments"' <<<"$rendered")" -ge 5
          # Micrometer common tags (recurring-mandates 2ad4e7f): squad = the release namespace, app = the service account.
          grep -q 'METRICS_TAG_SQUAD: "payments"' <<<"$rendered"
          grep -q "METRICS_TAG_APP: \"$sa\"" <<<"$rendered"
          strimzi="$(helm template ci "$chart" "${args[@]}" --set kafka.profile=kafka-strimzi --show-only templates/deployment.yaml)"
          grep -A4 'name: KAFKA_TLS_CA' <<<"$strimzi" | grep -q 'name: "fintechbankx-cluster-ca-cert"'

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  asyncapi:
    name: deploy/asyncapi-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provider event contract
        run: for spec in api/asyncapi/*.yaml; do npx -y @asyncapi/cli@2.13.0 validate "$spec"; done
