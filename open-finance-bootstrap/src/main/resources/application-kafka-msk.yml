# Amazon MSK with IAM authentication (Helm default: SPRING_PROFILES_ACTIVE=kafka-msk).
# Credentials come from the default AWS chain (the pod's IRSA web identity);
# the IRSA role carries the topic-scoped MSK policy from deploy/terraform.
spring:
  kafka:
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
