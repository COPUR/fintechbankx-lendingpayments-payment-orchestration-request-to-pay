# AsyncAPI contract for svc-pay-request-to-pay.
# Status: Proposed. Provider copy (this repository owns it); the asyncapi catalog mirrors it.
# Naming: docs/NAMING_CONVENTION_DDD_EDA_BUSINESS_CONTEXT.md
# Validate: npx -y @asyncapi/cli@2.13.0 validate asyncapi/svc-pay-request-to-pay.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-pay-request-to-pay
info:
  title: svc-pay-request-to-pay events
  version: 1.0.0
  description: |-
    Event contract for svc-pay-request-to-pay (repository fintechbankx-lendingpayments-payment-orchestration-request-to-pay, canonical name fintechbankx-payments-request-to-pay-service).

    Status: Proposed. Owner: Recurring and Bulk Payments Squad, Lending and Money Movement Tribe. Event namespace: `evt.pay.rtp`.

    Implementation status: written by the transactional outbox (OutboxPayRequestEventPublisher, table sc_pay_request_to_pay.outbox_event) in the pay request's transaction and relayed by OutboxRelay (one active relay per service, per-aggregate order). Relay failures follow ADR-021 decision 4: a payload error (RecordTooLarge, Serialization, InvalidTopic) parks the row and its aggregate's later events wait until an operator replays it; every other error stops the relay without marking anything and it retries with backoff. Consumers never see an aggregate's events out of order, but a parked event delays the later events of that pay request. The legacy topic rtp.pay_requests.v1 is no longer published: its publisher could not start (no runnable application, two competing notification beans), so no consumer ever received it and no dual-publish window is needed. Envelope shape is pinned by PayRequestEventEnvelopeFactoryTest.

    Every message uses the standard envelope (common/event-envelope.yaml). Record key is the aggregateId. Topics use cleanup.policy=delete. Adding an optional field is a minor change; any removal, rename or type change is a new major version on a new topic with dual-publish.

    Mapping notes: Source record fields eventId, aggregateId and occurredOn move to the envelope (eventId, aggregateId, occurredAt). The record field version is a schema version (always 1) and is carried by the eventType suffix, not by aggregateVersion.

    Identifier note: aggregateId (the record key) is the pay request's id, published on the TPP API as Data.ConsentId under /open-finance/v1/payment-consents/{consentId} for monolith compatibility. It is a pay-request id local to evt.pay.rtp, minted by this service. It is not a consent of svc-of-consent-authorization (evt.of.consent): do not look it up there or correlate it with consent events.

    Dead letters: this service consumes no topic, so it has no dead-letter topic. A consumer of evt.pay.rtp.* that gives up on a message writes it to its own <consumer namespace>.dlq.v1, declared in its own AsyncAPI (ADR-019, platform contract "Dead-letter topics").
  tags:
  - name: payments
  - name: evt.pay.rtp
  x-service-id: svc-pay-request-to-pay
  x-event-namespace: evt.pay.rtp
  x-owning-squad: Recurring and Bulk Payments Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit,
      SASL_SSL with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
      Runtime profile kafka-msk.
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with
      Strimzi-issued client certificates. Runtime profile kafka-strimzi.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  created:
    address: evt.pay.rtp.created.v1
    title: evt.pay.rtp.created.v1
    description: Payments.PayRequest.Created.v1. A request to pay was created for the debtor.
    messages:
      PayRequestCreated:
        $ref: '#/components/messages/PayRequestCreated'
    bindings:
      kafka:
        topic: evt.pay.rtp.created.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  accepted:
    address: evt.pay.rtp.accepted.v1
    title: evt.pay.rtp.accepted.v1
    description: Payments.PayRequest.Accepted.v1. The requesting TPP reported acceptance of the request with paymentId
      X (request status CONSUMED). This service does not verify the debtor's authorisation or that payment X exists;
      consumers must not treat this event as the debtor's consent or as proof of a payment.
    messages:
      PayRequestAccepted:
        $ref: '#/components/messages/PayRequestAccepted'
    bindings:
      kafka:
        topic: evt.pay.rtp.accepted.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  rejected:
    address: evt.pay.rtp.rejected.v1
    title: evt.pay.rtp.rejected.v1
    description: Payments.PayRequest.Rejected.v1. The requesting TPP reported that the debtor declined the request.
    messages:
      PayRequestRejected:
        $ref: '#/components/messages/PayRequestRejected'
    bindings:
      kafka:
        topic: evt.pay.rtp.rejected.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
operations:
  publishPayRequestCreated:
    action: send
    title: Publish Payments.PayRequest.Created.v1
    summary: svc-pay-request-to-pay publishes Payments.PayRequest.Created.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/created'
    messages:
    - $ref: '#/channels/created/messages/PayRequestCreated'
  publishPayRequestAccepted:
    action: send
    title: Publish Payments.PayRequest.Accepted.v1
    summary: svc-pay-request-to-pay publishes Payments.PayRequest.Accepted.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/accepted'
    messages:
    - $ref: '#/channels/accepted/messages/PayRequestAccepted'
  publishPayRequestRejected:
    action: send
    title: Publish Payments.PayRequest.Rejected.v1
    summary: svc-pay-request-to-pay publishes Payments.PayRequest.Rejected.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/rejected'
    messages:
    - $ref: '#/channels/rejected/messages/PayRequestRejected'
components:
  schemas:
    EventEnvelope:
      $ref: ./common/event-envelope.yaml#/EventEnvelope
    EventHeaders:
      $ref: ./common/event-envelope.yaml#/EventHeaders
    MonetaryAmount:
      $ref: ./common/event-envelope.yaml#/MonetaryAmount
    DecimalAmount:
      $ref: ./common/event-envelope.yaml#/DecimalAmount
    PayRequestCreatedData:
      type: object
      description: Payload of Payments.PayRequest.Created.v1.
      properties:
        creditorName:
          type: string
          maxLength: 140
          description: >-
            Creditor display name as entered by the requesting TPP (free text, up to 140
            characters). Data classification: confidential (payment party data; may name a
            natural person when the creditor is a sole trader). Consumers must not log it and
            keep it only as long as their own retention allows. Inclusion pending the data
            owner's sign-off.
          x-data-classification: confidential
        amount:
          allOf:
          - $ref: '#/components/schemas/DecimalAmount'
          description: Requested amount.
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: ^[A-Z]{3}$
        debtorId:
          type: string
          description: >-
            Opaque PSU reference of the debtor, exactly as the requesting TPP sent it in
            Data.PsuId (the customer_id format). It is not pseudonymised by this service; it
            carries no personal data by format. Data classification: internal identifier.
          pattern: ^[A-Za-z0-9-]{1,64}$
          x-data-classification: internal
      required:
      - creditorName
      - amount
      - currency
      - debtorId
    PayRequestAcceptedData:
      type: object
      description: Payload of Payments.PayRequest.Accepted.v1.
      properties:
        paymentId:
          type: string
          minLength: 1
          description: Payment id reported by the requesting TPP with the acceptance. Not verified by this service.
        amount:
          allOf:
          - $ref: '#/components/schemas/DecimalAmount'
          description: Accepted amount.
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: ^[A-Z]{3}$
        creditorName:
          type: string
          maxLength: 140
          description: >-
            Creditor display name. Data classification: confidential (see
            PayRequestCreatedData.creditorName).
          x-data-classification: confidential
        debtorId:
          type: string
          description: >-
            Opaque PSU reference of the debtor, exactly as the requesting TPP sent it in
            Data.PsuId (the customer_id format). It is not pseudonymised by this service; it
            carries no personal data by format. Data classification: internal identifier.
          pattern: ^[A-Za-z0-9-]{1,64}$
          x-data-classification: internal
        actorClientId:
          type: string
          description: Optional. OAuth2 client (azp) that made the decision; today always the TPP that created the
            request.
        reason:
          type: string
          maxLength: 256
          description: Optional free text sent with the decision. Data classification confidential; do not log.
          x-data-classification: confidential
      required:
      - paymentId
      - amount
      - currency
      - creditorName
      - debtorId
    PayRequestRejectedData:
      type: object
      description: Payload of Payments.PayRequest.Rejected.v1.
      properties:
        actorClientId:
          type: string
          description: Optional. OAuth2 client (azp) that made the decision; today always the TPP that created the
            request.
        reason:
          type: string
          maxLength: 256
          description: Optional free text sent with the decision. Data classification confidential; do not log.
          x-data-classification: confidential
  messages:
    PayRequestCreated:
      name: PayRequestCreated
      title: Payments.PayRequest.Created.v1
      summary: A request to pay was created for the debtor.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Created.v1
            producer:
              const: svc-pay-request-to-pay
            data:
              $ref: '#/components/schemas/PayRequestCreatedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId, the pay request id (Data.ConsentId on the TPP API; local to evt.pay.rtp, not a
              consent-authorization consent).
          bindingVersion: 0.5.0
      x-source-class: com.enterprise.openfinance.requesttopay.domain.event.PayRequestCreatedEvent
    PayRequestAccepted:
      name: PayRequestAccepted
      title: Payments.PayRequest.Accepted.v1
      summary: The requesting TPP reported acceptance with paymentId X (request status CONSUMED); not verified by this
        service.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Accepted.v1
            producer:
              const: svc-pay-request-to-pay
            data:
              $ref: '#/components/schemas/PayRequestAcceptedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId, the pay request id (Data.ConsentId on the TPP API; local to evt.pay.rtp, not a
              consent-authorization consent).
          bindingVersion: 0.5.0
      x-source-class: com.enterprise.openfinance.requesttopay.domain.event.PayRequestAcceptedEvent
    PayRequestRejected:
      name: PayRequestRejected
      title: Payments.PayRequest.Rejected.v1
      summary: The requesting TPP reported that the debtor declined the request.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Rejected.v1
            producer:
              const: svc-pay-request-to-pay
            data:
              $ref: '#/components/schemas/PayRequestRejectedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId, the pay request id (Data.ConsentId on the TPP API; local to evt.pay.rtp, not a
              consent-authorization consent).
          bindingVersion: 0.5.0
      x-source-class: com.enterprise.openfinance.requesttopay.domain.event.PayRequestRejectedEvent
  securitySchemes:
    mskIam:
      type: userPassword
      description: SASL_SSL with SASL mechanism AWS_MSK_IAM. There is no user or password; the client signs with the
        AWS credentials of its IRSA role, and a topic-scoped IAM policy (terraform module msk-client-access) grants
        produce or consume rights. AsyncAPI has no IAM scheme type, so userPassword stands for the SASL family.
      x-sasl-mechanism: AWS_MSK_IAM
    mtls:
      type: X509
      description: Mutual TLS with Strimzi-issued client certificates (local and non-AWS clusters only).
