{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rtp.dbSecretName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rtp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "rtp.dbSecretName" . | quote }}
    creationPolicy: Owner
  # The only key this Secret materialises (rtp.guard passes it to fbx.guard as externalSecret.data).
  data:
    - secretKey: "SPRING_DATASOURCE_PASSWORD"
      remoteRef:
        # <env>/payment-request-to-pay-service/db-app (deploy/terraform output app_db_secret_name)
        key: {{ include "rtp.remoteKey" (list "externalSecret.remoteSecretName" .Values.externalSecret.remoteSecretName) | quote }}
        property: "password"
{{- end }}
